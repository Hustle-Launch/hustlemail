name: Check Hustlemail

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build --workspace @hustlemail/config
      - run: npm run build --workspace @hustlemail/cli
      - run: npm run config:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build --workspace @hustlemail/native

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev patchelf
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build --workspace @hustlemail/native
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --manifest-path apps/native/src-tauri/Cargo.toml
      - run: cargo +stable fmt --manifest-path apps/native/src-tauri/Cargo.toml --check
      - run: cargo +stable test --locked --manifest-path apps/native/src-tauri/Cargo.toml --lib
